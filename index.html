<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>ページのタイトル</title>
</head>
<body>
    <label for="name">食材の種類：</label>
    <input type="text" id="name" name="user_name" placeholder="例：ひらがなで">
    <h1>こんにちは！</h1>

    <p id="message"></p>
    <button id="btn">クリック</button>
    <p id="message2"></p>
    <button id="btn2">クリック</button>
    <p id="text"></p>
    <script>
        const index =["お気に入り(1or0)","種類ID","ID","度数","単位","購入日","消費期限"]
        let INDEX=[]
        let ID=[]
        let IDNAME={}
        let NUMBER=0
        let key=0
        let SP[0]=["短期","長期","保存食"]
        let SP[1][0]=["肉","野菜","その他"]
        let SP[1][1][0]=["鳥","豚","牛"]
        let SP[1][2][0]=["根菜類","葉菜類","果菜類"]
        let SP[2][0]=["調味料","麺","粉・乾物","冷凍食品","その他"]
        let SP[3][0]=["缶詰","瓶詰め","レトルト","インスタント","麺","米","水"]
        
        
        let BOX={}//値はすべて-1
        let NOW = Date.now();// 例: 1736508364000 (巨大な10進法の数値)
        NOW=NOW/86400000
        
        const button = document.getElementById('btn');
        const button2 = document.getElementById('btn2');
        const textElement = document.getElementById('message');
        const textElement2 = document.getElementById('message2');


        const fragment = document.createDocumentFragment();
        for (let i = 0; i <= NUMBER-1; i++) {
            const li = document.createElement('h1');
            li.textContent = 0;
            if (key == 0) {
            　　　textElement.textContent = '種類別検索';
            　　　textElement2.textContent = '期限切れ間近';
            　　　let a='種類別検索';
            　　　let b='期限切れ間近';
            　　　let c=1;
            　　　let d=2;
            };
            if (key == 1) {
               textElement.textContent = '欠品表';
               textElement2.textContent = '期限切れ間近';
               let a='欠品表';
               let b='期限切れ間近';
               let c=0;
               let d=2;
            };
            if (key == 2) {
               textElement.textContent = '欠品表';
               textElement2.textContent = '種類別検索';
               let b='種類別検索';
               let a='欠品表';
               let c=0;
               let d=1;
            };
        
            button.onclick = () => alert(a);
            button.addEventListener('click', () => {
            key = c ;
　　　　　    });

            button2.onclick = () => alert(b);
            button2.addEventListener('click', () => {
            key = d;
            });



            
            if ( key==0 ) {
             if (INDEX[i][0] == 1) {
                if (BOX[INDEX[i][1]] == -1) {
                   BOX[INDEX[i][1]]==0
                };
                if (INDEX[i][3] != 0) {
                   BOX[INDEX[i][1]]+=INDEX[i][3];
                };
             };
             if (i == NUMBER-1) {
                       for (let k = 0; k <= NUMBER-1; k++) {
                           if (BOX[ID[k]]==0) {
                               li.textContent =ID[k] ;
                               fragment.appendChild(li);
                           };
                       };
             };
            };
            if (key == 1) {   　　
               if (INDEX[i][1] == NAME[]) {
                   const fragment = document.createDocumentFragment();
                   let li = document.createElement('h1');
                   li.textContent = INDEX[i];
                   fragment.appendChild(li);
                   let pq = document.createElement('button');
                   fragment.appendChild(pq);
               };
            };
            if (key == 2) {   　　
               if (INDEX[i][6]- NOW <= 3) {
                   const fragment = document.createDocumentFragment();
                   const li = document.createElement('h1');
                   li.textContent = INDEX[i];
                   fragment.appendChild(li);
               };
            }; // ここではまだ画面は変わらない
       
 }
        if (li.textContent == 0) {
            li.textContent = "データ無し";
            fragment.appendChild(li);
        }
        document.getElementById('text').appendChild(fragment); // ここで一気に表示！
    </script>
    
</body>
</html>
