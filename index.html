<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在庫管理システム</title>
</head>
<body>
    <h1 id="ACC">在庫管理システム</h1>

    <div id="controls">
        <p>欠品表 <button id="btn">表示</button></p>
        <p>検索 <button id="btn2">表示</button></p>
        <p>消費期限間近 <button id="btn3">表示</button></p>
    </div>
    <hr>
    <div id="Heading"></div>
    <div id="text"></div>

    <script type="module">
        import { Octokit } from "https://esm.sh/@octokit/core";

        // --- 状態管理変数 ---
        let DATABASE = [];
        let NUM = 0;
        let FAV = [112];
        let FNUM = 1;
        let IDN = { 111: 2, 113: 1 };
        let TOKEN = "";
        let currentSha = null;
        let octokit = null;

        const CONFIG = {
            owner: 'item-management-system-hermes',
            repo: 'DATABASE',
            path: 'test.txt'
        };

        // --- 初期設定: アクセストークン入力 ---
        const access1 = document.createElement("button");
        const access2 = document.createElement("input");
        access1.textContent = '接続';
        access2.type = 'password';
        access2.placeholder = "GitHub Token";
        document.getElementById("ACC").appendChild(access2);
        document.getElementById("ACC").appendChild(access1);

        access1.addEventListener('click', async () => {
            TOKEN = access2.value;
            octokit = new Octokit({ auth: TOKEN });
            await load();
            alert("データ読み込み完了");
        });

        // --- GitHub API 通信 ---
        async function load() {
            try {
                const response = await octokit.request('GET /repos/{owner}/{repo}/contents/{path}', CONFIG);
                currentSha = response.data.sha;
                const downloadedString = decodeURIComponent(escape(atob(response.data.content)));
                const List = JSON.parse(downloadedString);
                
                DATABASE = List[0];
                NUM = List[1];
                FAV = List[2];
                FNUM = List[3];
                IDN = List[4];
            } catch (e) {
                console.error("読込エラー:", e);
                alert("データの取得に失敗しました。");
            }
        }

        async function save() {
            const jsonString = JSON.stringify([DATABASE, NUM, FAV, FNUM, IDN]);
            const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

            try {
                const res = await octokit.request('PUT /repos/{owner}/{repo}/contents/{path}', {
                    ...CONFIG,
                    message: 'JSからの更新',
                    content: contentEncoded,
                    sha: currentSha
                });
                currentSha = res.data.content.sha; // 次回更新のために新しいSHAを保存
            } catch (e) {
                console.error("保存エラー:", e);
                alert("保存に失敗しました。");
            }
        }

        // --- ロジック部分（既存のロジックを維持） ---
        let NOW = Math.floor(Date.now() / 86400000);
        let NAME = { 111: "鶏肉", 112: "豚肉", 113: "牛肉" };

        // 欠品表
        function M(N, F, FN) {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < N; i++) {
                const li = document.createElement("h1");
                li.textContent = FN[F[i]] || "不明な食材";
                fragment.appendChild(li);
            }
            document.getElementById("text").appendChild(fragment);
        }

        // 期限間近チェック
        function D(N, DB, now, fn) {
            const fragment = document.createDocumentFragment();
            DB.forEach(item => {
                let limit = item[4] - now;
                if (limit <= 3) {
                    const li = document.createElement("h1");
                    li.textContent = `${fn[item[0]] || '未設定'}[${item[1]}]: ${item[2]}${item[3]} | あと${limit}日`;
                    fragment.appendChild(li);
                }
            });
            document.getElementById("text").appendChild(fragment);
        }

        // ※ 検索(S関数)は非常に複雑な再帰構造のため、基本構造を維持しつつエラーを回避する形にしてください。

        // --- イベントリスナー ---
        document.getElementById('btn').addEventListener('click', () => {
            document.getElementById("text").innerHTML = "";
            M(FNUM, FAV, NAME);
        });

        document.getElementById('btn3').addEventListener('click', () => {
            document.getElementById("text").innerHTML = "";
            D(DATABASE.length, DATABASE, NOW, NAME);
        });

    </script>
</body>
</html>
