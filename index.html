<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>食材管理アプリ v2</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; padding: 20px; background-color: #f9f9f9; color: #333; }
        h1, h2, h3 { color: #2c3e50; }
        
        /* ボタンの共通スタイル */
        button { 
            padding: 8px 12px; 
            margin: 5px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { opacity: 0.8; }

        /* メニューボタン */
        .menu-btn { background-color: #3498db; color: white; width: 100%; margin-bottom: 10px; padding: 10px; font-size: 16px; }
        
        /* 機能ボタン */
        .btn-add { background-color: #2ecc71; color: white; } /* 緑 */
        .btn-del { background-color: #e74c3c; color: white; font-size: 12px; margin-left: 10px;} /* 赤 */
        .btn-fav { background-color: #f1c40f; color: white; font-weight: bold; } /* 黄 */
        .btn-fav.inactive { background-color: #bdc3c7; color: #fff; } /* グレー */
        .btn-back { background-color: #95a5a6; color: white; } /* グレー */

        /* リスト表示 */
        .item-row { 
            background: white; 
            border-bottom: 1px solid #eee; 
            padding: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .danger { color: #e74c3c; font-weight: bold; }
        .safe { color: #2ecc71; }
        
        /* 入力フォーム */
        .input-area { background: #fff; padding: 15px; margin-top: 20px; border-radius: 8px; border: 1px solid #ddd; }
        input, select { padding: 8px; margin-right: 5px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
