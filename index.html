        // M: 欠品表示 (お気に入り)
        function M(N, F, FN) {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < N; i++) {
                const li = document.createElement("h2");
                li.textContent = "欠品中: " + (FN[F[i]] || "不明な食材");
                fragment.appendChild(li);
            }
            document.getElementById("text").appendChild(fragment);
        }

        // S: カテゴリー検索
        function S(n, d, l, y) {
            const container = document.getElementById("text");
            container.innerHTML = ""; // 初期化
            const fragment = document.createDocumentFragment();

            // カテゴリーリストを走査
            for (let i = 0; i < n; i++) {
                if (l[i] === y) {
                    // 子要素（y+1, y+2...）を探す
                    for (let k = 1; ; k++) {
                        let Y = y + k;
                        if (d[Y] === undefined) break; // 見つからなくなったら終了

                        const li = document.createElement("h2");
                        const cl = document.createElement("button");
                        li.textContent = d[Y];
                        cl.textContent = "下位分類に入る";
                        cl.onclick = () => {
                            let nextLevel = Y * 10;
                            S(CATEn, CATEd, CATEl, nextLevel);
                        };
                        fragment.appendChild(li);
                        fragment.appendChild(cl);
                    }
                    break;
                }
            }

            // 上位に戻るボタン
            if (y !== 0) {
                const backBtn = document.createElement("button");
                backBtn.textContent = "上位分類に戻る";
                backBtn.onclick = () => {
                    let prevLevel = Math.floor(y / 10);
                    S(CATEn, CATEd, CATEl, prevLevel);
                };
                fragment.appendChild(document.createElement("br"));
                fragment.appendChild(backBtn);
            }

            container.appendChild(fragment);
        }

        // D: 消費期限チェック
        function D(N, DB, now, fn) {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < N; i++) {
                let limitDate = DB[i][4];
                let diff = limitDate - now;
                if (diff <= 3) {
                    const li = document.createElement("h2");
                    li.textContent = `${fn[DB[i][0]]} [${DB[i][1]}] : ${DB[i][2]}${DB[i][3]} | 残り ${diff} 日`;
                    fragment.appendChild(li);
                }
            }
            document.getElementById("text").appendChild(fragment);
        }
