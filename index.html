<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>ページのタイトル</title>
</head>
<body>
    <label for="name">お名前：</label>
    <input type="text" id="name" name="user_name" placeholder="例：山田 太郎">
    <h1>こんにちは！</h1>
    <p>在庫検索</p>
    <button id="btn">クリック</button>

    <p id="message">在庫表編集。</p>
    <button id="btn2">クリック</button>
    <script>
        // ここに直接JavaScriptを書く
        const btn = document.getElementById('btn2');
        btn.onclick = () => alert('動きました！');
        // 1. 要素を取得
        const textElement = document.getElementById('message');
        const buttonElement = document.getElementById('btn2');

        // 2. ボタンをクリックした時の処理を設定
        buttonElement.addEventListener('click', () => {
        // 3. テキストの内容を書き換える
        textElement.textContent = 'テキストが書き換わりました！';
});

        const fragment = document.createDocumentFragment();
        for (let i = 1; i <= 100; i++) {
            const li = document.createElement('h1');
            li.textContent = i + '個目のアイテム';
            fragment.appendChild(li); // ここではまだ画面は変わらない
}
        document.getElementById('btn2').appendChild(fragment); // ここで一気に表示！
    </script>
    
    <h1>こんにちは！</h1>
</body>
</html>
