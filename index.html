<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>在庫管理</title>
</head>
<body>
    <h1 id="ACC">在庫管理システム</h1>

    <p id="message">欠品表</p>
    <button id="btn">List</button>
    <p id="message2">検索</p>
    <button id="btn2">クリック</button>
    <p id="message3">消費期限間近</p>
    <button id="btn3">クリック</button>
    <p id="Heading"></p>
    <p id="text"></p>
    <script type="module" >
        import { Octokit } from "https://esm.sh/@octokit/core";
        let DATABASE=[[111,1,1,"パック",20480],[111,2,1,"パック",20467],[113,1,1,"パック",20468],]
        let NUM=3
        let FAV=[112]
        let FNUM=1
        let IDN={111:2,113:1}
        let test

        


        let octokit = null;
        let currentSha = null; // 更新に必須

        const CONFIG = {
            owner: 'item-management-system-hermes',
            repo: 'DATABASE',
            path: 'test.text'
        };

        // --- GitHub連携処理 ---
        async function load() {
            try {
// 1. Base64をバイナリ文字列に変換
const binaryString = atob(response.data.content);

// 2. バイナリ文字列をバイト配列（Uint8Array）に変換
const bytes = new Uint8Array(binaryString.length);
for (let i = 0; i < binaryString.length; i++) {
    bytes[i] = binaryString.charCodeAt(i);
}

// 3. UTF-8としてデコード（ここで日本語が復活する）
const decoded = new TextDecoder().decode(bytes);
                
                const List = JSON.parse(decoded);
                test=List
                DATABASE = List[0];
                NUM = List[1];
                FAV = List[2];
                FNUM = List[3];
                IDN = List[4];
                alert("データの読み込みに成功しました");
            } catch (e) {
                console.error(e);
                alert("読み込み失敗。リポジトリ名やトークンを確認してください。");
            }
        }

        async function save() {
            if (!currentSha) return alert("データが読み込まれていないため保存できません");
            
            const jsonString = JSON.stringify([DATABASE, NUM, FAV, FNUM, IDN]);
            const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

            try {
                const res = await octokit.request('PUT /repos/{owner}/{repo}/contents/{path}', {
                    ...CONFIG,
                    message: '在庫データの更新',
                    content: contentEncoded,
                    sha: currentSha
                });
                currentSha = res.data.content.sha; // 次回保存のためにSHAを更新
                console.log("保存成功");
            } catch (e) {
                console.error(e);
                alert("保存に失敗しました");
            }
        }

                            const access1 = document.createElement("button");
                            const access2 = document.createElement("input");
                            access1.textContent = '決定';
                            access2.type = 'text';
                            access2.placeholder = "アクセストークンを入力";
                            ACC.appendChild(access2);
                            ACC.appendChild(access1);
                            access1.addEventListener('click', () => {
                            let TOKEN=access2.value;
                            octokit = new Octokit({ auth: TOKEN });
                            load()})

        
        let NOW = Date.now();
        NOW=Number(NOW)
        NOW=Math.floor(NOW / 86400000);
        let NAME={111:"鶏肉",112:"豚肉",113:"牛肉"}
        function M(N,F,FN) {
        const fragment = document.createDocumentFragment();
            for (let i=0; i<=N-1; i++){
                const li = document.createElement("h1");
                li.textContent = FN[F[i]];
                fragment.appendChild(li);
                    }
        document.getElementById("text").appendChild(fragment);
        }
        function S(n,d,l,y,db,nu,c) {
        const fragment = document.createDocumentFragment();
            for (let i=0; i<=n-1; i++){
                if ( l[i]  == y){
                   i=n;
                   let s=0;
                   for (let k=1; s==0; k++){
                       let Y=y+k;
                       if (d[Y] != undefined){
                        const li = document.createElement("h1");
                        const cl = document.createElement("button");
                        li.textContent = d[Y];
                        cl.textContent = "下位分類に入る";
                        c=1;
                        cl.addEventListener('click', () => {
                          let j=Y*10;
                          c=0;
                          alert(j+"分類");
                          document.getElementById("text").innerHTML = "";
                          S(n,d,l,j,db,nu,c);//NはFの個数、
                       })
                       fragment.appendChild(li); 
                       fragment.appendChild(cl); }
                       if (d[Y] == undefined){
                           s=1;
                           }
                    }   
                }   
            }
            if (c==0){
                            const fragment2 = document.createDocumentFragment();
                            const suryou = document.createElement("p");
                            const kaigyou = document.createElement("p");
                            suryou.textContent = "個数を入力";
    // option要素を新しく作る
                            const input = document.createElement("input");
                            input.type = 'number';
                            input.placeholder = "今日から数えて期限は何日後か？";
                            const tani = document.createElement("input");
                            tani.type = 'text';
                            tani.placeholder = "単位名を入力";
                            const select = document.createElement("select");
                            for (let t=1; t<=100; t++){
                                       const option = document.createElement("option");
                                       option.value = t; // 送信される値
                                       option.innerText = t; // 画面に表示される文字
    // selectの中に追加する
                                       select.appendChild(option);
                            }
                            suryou.appendChild(select);
                            suryou.appendChild(tani);
                            fragment2.appendChild(suryou);
                            fragment2.appendChild(input);
                            const ax = document.createElement("button");
                            const kx = document.createElement("button");
                            ax.textContent = "追加";
                            ax.addEventListener('click', () => {
                                        if(tani.value=="" ||input.value==""){
                                            FAV.splice(MEMOX, 1);
                                            FNUM=FNUM-1;
                                            alert("入力欄に空欄が存在します");
                                        }else{
                                            nu=nu+1;
                                            IDN[y/10]=IDN[y/10]+1;
                                            let rz=Number(input.value)+Number(NOW)
                                            db.push([y/10,IDN[y/10],select.value,tani.value,rz]);
                                            save();
                                            alert("追加成功");
                                        }
                                        document.getElementById("text").innerHTML = "";
                                        document.getElementById("Heading").innerHTML = "";
                                        S(CATEn,CATEd,CATEl,y,db,nu,c);//NはFの個数、
                           })
                            let NAMEOFF="登録する";
                            let h=y/10
                            let MEMOX
                            for(let v=0; v<=FNUM-1; v++){
                                if(FAV[v]==h){
                                    NAMEOFF="登録解除";
                                    MEMOX=v;
                                }
                            }
                            kx.textContent = "お気に入り"+NAMEOFF; 
                            kx.addEventListener('click', () => {
                                        if(NAMEOFF=="登録解除"){
                                            FAV.splice(MEMOX, 1);
                                            FNUM=FNUM-1;
                                            save();
                                            alert("お気に入り解除");
                                        }else{
                                            FNUM=FNUM+1;
                                            FAV.push(h);
                                            save();
                                            alert("お気に入り登録");
                                        }
                                        document.getElementById("text").innerHTML = "";
                                        document.getElementById("Heading").innerHTML = "";
                                        S(CATEn,CATEd,CATEl,y,db,nu,c);//NはFの個数、
                           })
                            fragment2.appendChild(ax);
                            fragment2.appendChild(kaigyou);
                            fragment2.appendChild(kx);
                            document.getElementById("Heading").appendChild(fragment2);
                            for (let t=0; t<=nu-1; t++){
                                let q=~~(y/10);
                                if(db[t][0]==q) {
                                    const et = document.createElement("p");
                                    const li = document.createElement("h1");
                                    const pq = document.createElement("button");
                                    let ry=Number(db[t][4])-Number(NOW)
                                    ry="あと"+String(ry)+"日"
                                    li.textContent = NAME[db[t][0]]+"["+db[t][1]+"]:"+db[t][2]+db[t][3]+"|"+ry;
                                    pq.textContent = "削除";
                                    et.textContent = "-------------------------";
                                    fragment.appendChild(li); 
                                    fragment.appendChild(pq);
                                    fragment.appendChild(et);
                                    pq.addEventListener('click', () => {
                                        db.splice(t, 1);
                                        nu=nu-1;
                                        save();
                                        alert(y+"分類");
                                        document.getElementById("text").innerHTML = "";
                                        document.getElementById("Heading").innerHTML = "";
                                        S(CATEn,CATEd,CATEl,y,db,nu,c);//NはFの個数、
                           })
                                }
                            }

                    }
        const jv = document.createElement("button");
        const gj = document.createElement("h1");
        jv.textContent = "上位分類に戻る";
        jv.addEventListener('click', () => {
               let j=~~(y/100);
               j=j*10;
               c=0;
               alert(j+"分類");
               document.getElementById("text").innerHTML = "";
               document.getElementById("Heading").innerHTML = "";
               S(n,d,l,j,db,nu,c);//NはFの個数、
        })
        fragment.appendChild(gj);  
        fragment.appendChild(jv);    
        document.getElementById("text").appendChild(fragment);
        }
        function D(N,DB,now,fn) {
        const fragment = document.createDocumentFragment();
            for (let i=0; i<=N-1; i++){
                let LIMIT=DB[i][4]-now;
                if ( LIMIT <= 3 ){
                    const li = document.createElement("h1");
                    let rx=Number(DB[i][4])-Number(NOW)
                    rx="あと"+String(rx)+"日"
                    li.textContent = fn[DB[i][0]]+"["+DB[i][1]+"]:"+DB[i][2]+DB[i][3]+"|"+rx;
                    fragment.appendChild(li);
                }    
            }
        document.getElementById("text").appendChild(fragment);
        }


        let CATEn=19
        let CATEd={1:"短期",2:"長期",3:"保存食",
                   11:"肉",12:"野菜",13:"その他",
                   111:"鶏肉",112:"豚肉",113:"牛肉",
                   21:"調味料",22:"麺",23:"粉・乾物",24:"お菓子",25:"冷凍食品",26:"その他",
                   31:"缶詰・瓶詰め",32:"レトルト",33:"インスタント",34:"主食",35:"水",36:"その他"}
        let CATEl=[0,10,20,30,110,120,130,210,220,230,240,250,260,310,320,330,340,350,360]
        let C=0
        let X=0
        
        const button = document.getElementById('btn');
        const button2 = document.getElementById('btn2');
        const button3 = document.getElementById('btn3');
        
        button.addEventListener('click', () => {
            alert("欠品表");
            document.getElementById("text").innerHTML = "";
            document.getElementById("Heading").innerHTML = "";
            M(FNUM,FAV,NAME);//NはFの個数、
        })
        button2.addEventListener('click', () => {
            alert("0分類");
            document.getElementById("text").innerHTML = "";
            document.getElementById("Heading").innerHTML = "";
            S(CATEn,CATEd,CATEl,X,DATABASE,NUM,C);//NはFの個数、
        })
        button3.addEventListener('click', () => {
            alert("期限間近");
            document.getElementById("text").innerHTML = "";
            document.getElementById("Heading").innerHTML = "";
            D(NUM,DATABASE,NOW,NAME);
        })
        //<label for="name">食材の種類：</label><input type="text" id="name" name="user_name" placeholder="例：ひらがなで">
    </script>
</body>
</html>
