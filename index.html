<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>ページのタイトル</title>
</head>
<body>
    <label for="name">食材の種類：</label>
    <input type="text" id="name" name="user_name" placeholder="例：ひらがなで">
    <h1>こんにちは！</h1>

    <p id="message">欠品表</p>
    <button id="btn">クリック</button>
    <p id="message2">検索</p>
    <button id="btn2">クリック</button>
    <p id="message3">消費期限間近</p>
    <button id="btn3">クリック</button>
    <p id="text"></p>
    <script>
        function M(N,F,FN) {
        const fragment = document.createDocumentFragment();
            for (let i=0; i<=N-1; i++){
                const li = document.createElement("h1");
                li.textContent = FN[F[i]];
                fragment.appendChild(li);
                    }
        document.getElementById("text").appendChild(fragment);
        }
        function S(n,d,l,y) {
        const fragment = document.createDocumentFragment();
            for (let i=0; i<=n-1; i++){
                if ( l[i]  == y){
                   i=n;
                   let s=0 
                   for (let k=1; s==0; k++){
                       let Y=y+k;
                       const li = document.createElement("h1");
                       const cl = document.createElement("button");
                       li.textContent = d[Y];
                       cl.textContent = "下位分類に入る";
                       if (d[Y] != undefined){
                        cl.addEventListener('click', () => {
                          let j=Y*10;
                          alert(j+"分類");
                          document.getElementById("text").innerHTML = "";
                          S(CATEn,CATEd,CATEl,j);//NはFの個数、
                       })}
                       if (d[Y] == undefined){
                           s=1;
                           li.textContent = "以上";
                           cl.textContent = "上位分類に戻る";
                           cl.addEventListener('click', () => {
                            let j=~~(y/10);
                            alert(j+"分類");
                            document.getElementById("text").innerHTML = "";
                            S(CATEn,CATEd,CATEl,j);//NはFの個数、
                           })}
                       fragment.appendChild(li); 
                       fragment.appendChild(cl); 
                    
                    }
                }
            }
        document.getElementById("text").appendChild(fragment);
        }
        function D(N,DB,now,fn) {
        const fragment = document.createDocumentFragment();
            for (let i=0; i<=N-1; i++){
                let LIMIT=DB[i][4]-now;
                if ( LIMIT <= 3 ){
                    const li = document.createElement("h1");
                    li.textContent = fn[DB[i][0]]+"["+DB[i][1]+"]:"+DB[i][2]+DB[i][3]+"|"+DB[i][4];
                    fragment.appendChild(li);
                }    
            }
        document.getElementById("text").appendChild(fragment);
        }


        let DATABASE=[[111,1,1,"パック",20468],[111,1,1,"パック",20467],[113,1,1,"パック",20468],]
        let NUM=3
        let FAV=[112]
        let FNUM=1
        let CATEn=19
        let CATEd={1:"短期",2:"長期",3:"保存食",11:"肉",12:"野菜",13:"その他",21:"調味料",22:"麺",23:"粉・乾物",24:"お菓子",25:"冷凍食品",26:"その他",31:"缶詰・瓶詰め",32:"レトルト",33:"インスタント",34:"主食",35:"水",36:"他"}
        let CATEl=[0,10,20,30,110,120,130,210,220,230,240,250,260,310,320,330,340,350,360]
        let X=0
        let NAME={111:"鳥肉",112:"豚肉",113:"牛肉"}
        let NOW = Date.now();
        NOW=Number(NOW)
        NOW=Math.floor(NOW / 86400000);
        
        const button = document.getElementById('btn');
        const button2 = document.getElementById('btn2');
        const button3 = document.getElementById('btn3');
        
        button.addEventListener('click', () => {
            alert("欠品表")
            document.getElementById("text").innerHTML = "";
            M(FNUM,FAV,NAME);//NはFの個数、
        })
        button2.addEventListener('click', () => {
            alert("0分類")
            document.getElementById("text").innerHTML = "";
            S(CATEn,CATEd,CATEl,X);//NはFの個数、
        })
        button3.addEventListener('click', () => {
            alert("期限間近")
            document.getElementById("text").innerHTML = "";
            D(NUM,DATABASE,NOW,NAME);
        })
    </script>
</body>
</html>
