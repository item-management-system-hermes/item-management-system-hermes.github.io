<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>ページのタイトル</title>
</head>
<body>
    <label for="name">食材の種類：</label>
    <input type="text" id="name" name="user_name" placeholder="例：ひらがなで">
    <h1>こんにちは！</h1>

    <p id="message">欠品表</p>
    <button id="btn">クリック</button>
    <p id="message2">検索</p>
    <button id="btn2">クリック</button>
    <p id="message3">消費期限間近</p>
    <button id="btn3">クリック</button>
    <p id="text"></p>
    <script>
        function M(N,F,FN) {
        const fragment = document.createDocumentFragment();
            for (let i=0; i<=N-1; i++){
                const li = document.createElement("h1");
           　　　li.textContent = FN[F[i]];
           　　　fragment.appendChild(li);
                    }
        document.getElementById("text").appendChild(fragment);
        }
        function D(N,DB,now,fn) {
        const fragment = document.createDocumentFragment();
            for (let i=0; i<=N-1; i++){
                if ( DB[i][4]-now <= 3 ){
                    const li = document.createElement("h1");
           　　　    li.textContent = fn[DB[i][1]]+"|"+DB[i][2]+":"+DB[i][3]+"|"+DB[i][4];
           　　　    fragment.appendChild(li);
                }    
            }
        document.getElementById("text").appendChild(fragment);
        }


        let DATABASE=[[111,1,1,"パック",20463]]
        let NUM=1
        let FAV=[112]
        let FNUM=1
        let FNAME={112:"豚肉"}
        let NOW = Date.now();// 例: 1736508364000 (巨大な10進法の数値)
        NOW=NOW/86400000
        
        const button = document.getElementById('btn');
        const button2 = document.getElementById('btn2');
        const button3 = document.getElementById('btn3');
        
        button.addEventListener('click', () => {
            alert("欠品表")
            document.getElementById("text").innerHTML = "";
            M(FNUM,FAV,FNAME);//NはFの個数、
        })
        button2.addEventListener('click', () => {
            alert("検索")
            document.getElementById("text").innerHTML = "";
            M(FNUM,FAV,FNAME);//NはFの個数、
        })
        button3.addEventListener('click', () => {
            alert("期限間近")
            document.getElementById("text").innerHTML = "";
            D(NUM,DATABASE,NOW,FNAME);//NはFの個数、
        })
    </script>
</body>
</html>
